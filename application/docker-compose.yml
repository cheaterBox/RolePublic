name: roletect

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database — Relational Storage with Row-Level Triggers
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roletect-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-roletect}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-roletect_secret_password}
      POSTGRES_DB: ${PG_DB:-roletect}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-roletect} -d ${PG_DB:-roletect}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 2. Redis — In-Memory Pub/Sub for Presence, Lock Manager & Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: roletect-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 3. MinIO — S3 Compatible Storage for Cross-Device Backup Cloud Testing
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: roletect-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - roletect-network

  # MinIO Bucket Auto-Provisioner
  minio-init:
    image: minio/mc:latest
    container_name: roletect-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing localminio/${S3_BUCKET:-roletect-backups};
      echo 'MinIO Backup Bucket Initialized!';
      exit 0;
      "
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 4. Web Frontend (Real-time Live Hot-Reloading with Bun)
  # ---------------------------------------------------------------------------
  web:
    image: oven/bun:1-alpine
    container_name: roletect-web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_TOKEN=${ROLETECT_API_TOKEN:-roletect_vps_master_token_2026}
      - PORT=3000
    volumes:
      - ./web-frontend:/app
      - /app/.next
    command: ["sh", "-c", "bun install && bun run dev --hostname 0.0.0.0 --port 3000"]
    networks:
      - roletect-network

# -----------------------------------------------------------------------------
# Networks & Volumes
# -----------------------------------------------------------------------------
networks:
  roletect-network:
    driver: bridge

volumes:
  api_data:
    name: roletect_api_data
  postgres_data:
    name: roletect_postgres_data
  redis_data:
    name: roletect_redis_data
  minio_data:
    name: roletect_minio_data
