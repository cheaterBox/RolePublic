name: roletect

services:
  # ---------------------------------------------------------------------------
  # 1. API — Axum Rust Backend (LaTeX engine + Multi-driver persistence + AI)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: roletect-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgres://roletect:roletect_secret_password@postgres:5432/roletect}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ROLETECT_DATA_DIR=/data
      - ROLETECT_THEMES_PATH=/app/themes.toml
      - ROLETECT_API_TOKEN=${ROLETECT_API_TOKEN:-roletect_vps_master_token_2026}
      - REQUIRE_TOKEN=${REQUIRE_TOKEN:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-1200}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RUST_LOG=${RUST_LOG:-info,roletect_api=debug}
      # S3 / MinIO Cloud Storage Configuration
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-roletect-backups}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 2. Web Frontend — Next.js Standalone Interface
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: roletect-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_TOKEN=${ROLETECT_API_TOKEN:-roletect_vps_master_token_2026}
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database — Relational Storage with Row-Level Triggers
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roletect-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-roletect}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-roletect_secret_password}
      POSTGRES_DB: ${PG_DB:-roletect}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-roletect} -d ${PG_DB:-roletect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 4. Redis — In-Memory Pub/Sub for Presence, Lock Manager & Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: roletect-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - roletect-network

  # ---------------------------------------------------------------------------
  # 5. MinIO — S3 Compatible Storage for Cross-Device Backup Cloud Testing
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: roletect-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - roletect-network

  # MinIO Bucket Auto-Provisioner
  minio-init:
    image: minio/mc:latest
    container_name: roletect-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing localminio/${S3_BUCKET:-roletect-backups};
      echo 'MinIO Backup Bucket Initialized!';
      exit 0;
      "
    networks:
      - roletect-network

# -----------------------------------------------------------------------------
# Networks & Volumes
# -----------------------------------------------------------------------------
networks:
  roletect-network:
    driver: bridge

volumes:
  api_data:
    name: roletect_api_data
  postgres_data:
    name: roletect_postgres_data
  redis_data:
    name: roletect_redis_data
  minio_data:
    name: roletect_minio_data
