app-id: com.ahmedtrooper.roletect
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk

command: roletect.sh

finish-args:
  # Display & GPU hardware acceleration
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --share=ipc
  - --device=dri

  # Network (LLM APIs, S3 sync, Extension server localhost, Tectonic packages)
  - --share=network

  # Filesystem permissions
  - --filesystem=xdg-documents/RoleTect:create
  - --filesystem=xdg-cache/Tectonic:create
  - --filesystem=home:ro

  # System features & IPC
  - --socket=session-bus
  - --talk-name=org.freedesktop.Notifications
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  - name: roletect
    buildsystem: simple
    build-commands:
      # 1. Install pre-compiled release binary
      - install -Dm755 src-tauri/target/release/roletect /app/bin/roletect

      # 2. Install launch wrapper (sets working dir so Tauri finds dist/)
      - install -Dm755 packaging/flatpak/roletect.sh /app/bin/roletect.sh

      # 3. Install bundled runtime libraries (if present)
      - mkdir -p /app/lib
      - bash -c 'if [ -d packaging/flatpak/lib ] && [ -n "$(ls -A packaging/flatpak/lib 2>/dev/null)" ]; then cp -a packaging/flatpak/lib/* /app/lib/; fi'

      # 4. Install frontend dist assets (Tauri resolves ../dist from /app/share/roletect)
      - mkdir -p /app/share/roletect
      - cp -r dist /app/share/roletect/dist

      # 5. Install Desktop file, AppStream metadata, and App Icon
      - install -Dm644 packaging/flatpak/com.ahmedtrooper.roletect.desktop /app/share/applications/com.ahmedtrooper.roletect.desktop
      - install -Dm644 packaging/flatpak/com.ahmedtrooper.roletect.metainfo.xml /app/share/metainfo/com.ahmedtrooper.roletect.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.ahmedtrooper.roletect.png
    sources:
      - type: dir
        path: ../../
